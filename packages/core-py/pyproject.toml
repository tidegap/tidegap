[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidegap"
version = "0.19.0"
description = "Run non-urgent LLM tasks at the cleanest grid hour before a deadline, via Batch APIs when allowed."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vitalii Borovyk" }]
requires-python = ">=3.11"
keywords = [
    "carbon-aware",
    "scheduling",
    "llm",
    "agents",
    "mcp",
    "ai",
    "sustainability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39,<3"]
openai = ["openai>=1.50,<4"]
signing = ["cryptography>=42"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "anthropic>=0.39,<3",
    "openai>=1.50,<4",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/tidegap/tidegap"
Issues = "https://github.com/tidegap/tidegap/issues"
Repository = "https://github.com/tidegap/tidegap"

[tool.hatch.build.targets.wheel]
packages = ["src/tidegap"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
