name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # pnpm version comes from package.json packageManager (v9.15.0).
        # Do not also set `version:` here — pnpm/action-setup@v6 errors
        # with ERR_PNPM_BAD_PM_VERSION on duplicates.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Force a fresh native rebuild — the runner's Node 20.x cache occasionally
      # serves a better-sqlite3 prebuild that doesn't match the runtime, causing
      # ERR_DLOPEN_FAILED on `import`. Rebuilding from source takes ~30s and
      # makes the tests deterministic across runner image rolls.
      - run: pnpm --filter "@tidegap/core" rebuild better-sqlite3
      - run: pnpm --filter "@tidegap/core" build
      # @tidegap/mcp imports @tidegap/cli/usage, so the CLI builds first (a
      # single-package filter does not build its dependencies).
      - run: pnpm --filter "@tidegap/cli" build
      - run: pnpm --filter "@tidegap/mcp" build
      # The OpenClaw plugin targets Node 22+ — its delivery store uses the
      # node:sqlite builtin (22.5+) with no better-sqlite3 fallback — so its
      # build + tests run only on the 22 and 24 matrix legs.
      - if: matrix.node != '20'
        run: pnpm --filter "@vitalini/tidegap" build
      # Typecheck every workspace package (tsc --noEmit). CI previously
      # gated build + tests only, so type regressions the emit-less build
      # tolerated could land; this closes that gap.
      - run: pnpm typecheck
      - run: pnpm --filter "@tidegap/core" test
      - run: pnpm --filter "@tidegap/mcp" test
      - run: pnpm --filter "@tidegap/cli" test
      # The OpenClaw plugin's 24 tests previously ran only via the local
      # root `pnpm test`, never in CI — gate them here (Node 22 and 24).
      - if: matrix.node != '20'
        run: pnpm --filter "@vitalini/tidegap" test
      # The @ebb-ai/* 0.17.1 shims run against the built @tidegap/* packages.
      # The @vitalini/ebb ClawHub pointer needs no build.
      - run: node --test compat/test/shims.test.mjs compat/test/clawhub-shim.test.mjs scripts/check-versions.test.mjs
      # Regenerate the brand SVGs and snippets (needs opentype.js, so it runs
      # here, not in the dependency-free data-ssot job) and fail on any diff.
      # This proves the committed outputs come from the generator and font.
      - if: matrix.node == '22'
        run: pnpm gen:brand:check

  data-ssot:
    name: data SSOT drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The generator is dependency-free (Node built-ins only), so no
      # install step is needed. Regenerate the TS + PY data modules from the
      # JSON SSOT and fail if the committed copies drift.
      - name: regenerate data modules from JSON SSOT
        run: node scripts/gen-data.mjs
      - name: fail if generated tables are stale
        run: git diff --exit-code -- packages/core-ts/src/data/tables.generated.ts packages/core-py/src/tidegap/_data.py
      # Dependency-free: inputs hash, PNG sha256 and dimensions against
      # assets/images.lock.json. CI does not render the images.
      - name: fail if generated images are stale
        run: node scripts/check-images.mjs

  python:
    name: python (3.11 + 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install tidegap
        working-directory: packages/core-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,openai]"
      - name: pytest
        working-directory: packages/core-py
        run: pytest -q
      - name: ruff
        working-directory: packages/core-py
        run: ruff check .
      - name: ebb-ai PyPI shim re-exports tidegap and warns once
        env:
          PYTHONPATH: compat/pypi/ebb-ai/src
        run: |
          python -c "import ebb_ai.grid, ebb_ai, tidegap.grid; assert ebb_ai.grid is tidegap.grid; assert ebb_ai.Scheduler is tidegap.Scheduler" 2> shim.err
          test "$(grep -c 'ebb-ai is now tidegap' shim.err)" = 1
