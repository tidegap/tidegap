<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tidegap</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <strong>Tidegap</strong>
    <span id="window" class="muted"></span>
  </header>
  <p id="readiness" role="status" hidden></p>
  <section id="status" hidden></section>
  <section id="queue">
    <p id="action-msg" role="status" aria-live="polite" hidden></p>
    <ul id="rows"></ul>
    <p id="empty" class="muted" hidden>No tasks queued. Ask your agent to schedule one.</p>
  </section>
  <footer>
    <button id="open" type="button">Open tidegap ui</button>
    <button id="options" type="button" class="link">Options</button>
  </footer>
</body>
</html>
